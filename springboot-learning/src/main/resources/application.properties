# ===========================================
# Spring Boot Learning - Bài 1 Configuration
# ===========================================

# Tên ứng dụng (hiển thị trong Actuator, log, ...)
spring.application.name=springboot-learning

# Server port (mặc định là 8080)
server.port=8080

# Bật banner tùy chỉnh (mặc định: Spring Boot ASCII art)
# spring.main.banner-mode=off

# Logging level
# Mức độ log từ thấp đến cao: TRACE < DEBUG < INFO < WARN < ERROR
# 📘 BÀI 7: Chi tiết cấu hình logging xem file logback-spring.xml
# Các dòng dưới đây vẫn hoạt động nhưng logback-spring.xml ưu tiên hơn
logging.level.root=INFO
logging.level.com.example.springbootlearning=DEBUG

# ===========================================
# Bài 3: Externalized Configuration (@Value demo)
# ===========================================
app.name=Spring Boot Learning Platform
app.version=1.0.0
app.description=Khoa hoc Master Spring Boot tu Zero den Hero
app.max-users=100
app.welcome-message=Chao mung den voi ${app.name} v${app.version}!
app.default-channel=SMS

# ===========================================
# 📘 BÀI 8: Swagger / OpenAPI (springdoc)
# ===========================================
# Swagger UI  : http://localhost:8080/swagger-ui.html
# JSON spec   : http://localhost:8080/v3/api-docs
# YAML spec   : http://localhost:8080/v3/api-docs.yaml
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Sắp xếp operation theo HTTP method, tag theo alphabet
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Mặc định chỉ mở danh sách endpoint (không expand chi tiết)
springdoc.swagger-ui.doc-expansion=list
# Hiện ô filter tìm kiếm theo tag
springdoc.swagger-ui.filter=true
# Hiển thị thời gian xử lý request khi "Try it out"
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json
# Production nên tắt: springdoc.api-docs.enabled=false / springdoc.swagger-ui.enabled=false

# ===========================================
# 📘 BÀI 9: Spring Data JPA + H2 In-Memory Database
# ===========================================
# H2 Database URL: mem:testdb (in-memory, dữ liệu được giải phóng khi restart)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
# ddl-auto: create-drop (tạo schema khi start, drop khi shutdown — lý tưởng cho dev & learning)
spring.jpa.hibernate.ddl-auto=create-drop
# Hiển thị câu lệnh SQL do Hibernate sinh ra trong console
spring.jpa.show-sql=true
# Format câu SQL cho đẹp, thụt dòng dễ đọc
spring.jpa.properties.hibernate.format_sql=true
# Highlight màu từ khóa SQL trong log console
spring.jpa.properties.hibernate.highlight_sql=true
# In giá trị tham số của bind parameter (? trong SQL)
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Tắt Open-Session-In-View để tránh connection pool leak theo chuẩn Enterprise
spring.jpa.open-in-view=false

# Cho phép nạp file data.sql sau khi Hibernate tạo schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

