# ===========================================
# Spring Boot Learning - Bài 1 Configuration
# ===========================================

# Tên ứng dụng (hiển thị trong Actuator, log, ...)
spring.application.name=springboot-learning

# Server port (mặc định là 8080)
server.port=8080

# Bật banner tùy chỉnh (mặc định: Spring Boot ASCII art)
# spring.main.banner-mode=off

# Logging level
# Mức độ log từ thấp đến cao: TRACE < DEBUG < INFO < WARN < ERROR
# 📘 BÀI 7: Chi tiết cấu hình logging xem file logback-spring.xml
# Các dòng dưới đây vẫn hoạt động nhưng logback-spring.xml ưu tiên hơn
logging.level.root=INFO
logging.level.com.example.springbootlearning=DEBUG

# ===========================================
# Bài 3: Externalized Configuration (@Value demo)
# ===========================================
app.name=Spring Boot Learning Platform
app.version=1.0.0
app.description=Khoa hoc Master Spring Boot tu Zero den Hero
app.max-users=100
app.welcome-message=Chao mung den voi ${app.name} v${app.version}!
app.default-channel=SMS
