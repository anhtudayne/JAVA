# ===================================================================
# 📘 BÀI 20: OAuth2 Resource Server Profile Configuration
#
# Cách kích hoạt profile này:
# 1. Chạy dòng lệnh: ./mvnw spring-boot:run -Dspring-boot.run.profiles=oauth2
# 2. Hoặc qua JAR: java -jar app.jar --spring.profiles.active=oauth2
# 3. Hoặc biến môi trường: SPRING_PROFILES_ACTIVE=oauth2
# ===================================================================

# -------------------------------------------------------------------
# Kịch bản 1: Self-Issued JWT (Khóa bí mật đối xứng HMAC-SHA256)
# -------------------------------------------------------------------
# Ứng dụng tự ký và tự kiểm tra bằng secret key được định nghĩa ở application.properties:
# jwt.secret=dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgYXV0aGVudGljYXRpb24gdGhhdCBpcyBhdCBsZWFzdCAyNTYgYml0cw==

# -------------------------------------------------------------------
# Kịch bản 2: External Authorization Server (Keycloak / Auth0 / Google)
# -------------------------------------------------------------------
# Khi kết nối với IdP doanh nghiệp dùng Asymmetric Key (RSA / EC) & JWKS,
# chỉ cần bỏ dấu comment dòng cấu hình tương ứng dưới đây:

# [Keycloak]: Tự động khám phá Discovery Document (.well-known/openid-configuration)
# spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/springboot-learning

# [Keycloak - Tùy chọn 2]: Chỉ định trực tiếp JWK Set URI không cần discovery endpoint
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/springboot-learning/protocol/openid-connect/certs

# [Google Identity Platform]:
# spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com

# [Auth0]:
# spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-example.us.auth0.com/
